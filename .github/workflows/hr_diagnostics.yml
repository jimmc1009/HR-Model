name: HR Diagnostics

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which diagnostic to run"
        required: true
        type: choice
        options:
          - validate_model
          - test_13_15_separators.py      # <-- add to the existing options list
          - test_progressive_squeeze.py
          - compare_tabs.py
          - test_parlay_bands.py
          - test_edge_bands.py
          - test_selector_bakeoff.py
          - test_platoon_backtest.py
          - check_pitcher_source.py
          - test_platoon_progressive.py

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth pandas numpy pytz pybaseball requests

      - name: Run validate_model.py
        if: inputs.script == 'validate_model'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python validate_model.py

      - name: 13-15 tier separators (3 lenses)
        if: github.event.inputs.script == 'test_13_15_separators.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_13_15_separators.py HR_All_Scores.csv

      - name: Progressive squeeze (burnout vs emergence)
        if: github.event.inputs.script == 'test_progressive_squeeze.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_progressive_squeeze.py

      - name: Compare Picks_Log vs Model_Bet_Tracker
        if: github.event.inputs.script == 'compare_tabs.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python compare_tabs.py

      - name: Parlay bands (2 & 3 leg, score & edge, consensus odds)
        if: github.event.inputs.script == 'test_parlay_bands.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_parlay_bands.py

      - name: Edge bands (resolved hit% vs implied breakeven)
        if: github.event.inputs.script == 'test_edge_bands.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_edge_bands. py

      - name: Selector bake-off (find the blend1 feel)
        if: github.event.inputs.script == 'test_selector_bakeoff.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_selector_bakeoff.py

      - name: Platoon fix backtest (old vs new)
        if: github.event.inputs.script == 'test_platoon_backtest.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_platoon_backtest.py

      - name: Check pitcher source data
        if: github.event.inputs.script == 'check_pitcher_source.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python check_pitcher_source.py

      - name: Platoon progressive vs threshold backtest
        if: github.event.inputs.script == 'test_platoon_progressive.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_platoon_progressive.py


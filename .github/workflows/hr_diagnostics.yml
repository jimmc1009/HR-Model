name: HR Diagnostics

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which diagnostic to run"
        required: true
        type: choice
        options:
          - validate_model
          - test_13_15_separators.py      # <-- add to the existing options list
          - test_progressive_squeeze.py
          - compare_tabs.py
          - test_parlay_bands.py
          - test_edge_bands.py
          - test_selector_bakeoff.py
          - test_platoon_backtest.py
          - check_pitcher_source.py
          - test_platoon_progressive.py
          - test_platoon_unfiltered.py
          - test_platoon_diagnose.py
          - inspect_matchup.py
          - test_wind_categories.py
          - test_wind_controlled.py
          - test_pitcher_barrel.py
          - test_within_matchup_separators.py
          - test_pitcher_trends.py
          - test_filter_bakeoff.py
          - test_dueness.py
          - test_blend_zones.py
          - test_monotonic.py
          - test_pocket_and_inversion.py


jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth pandas numpy pytz pybaseball requests

      - name: Run validate_model.py
        if: inputs.script == 'validate_model'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python validate_model.py

      - name: 13-15 tier separators (3 lenses)
        if: github.event.inputs.script == 'test_13_15_separators.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_13_15_separators.py HR_All_Scores.csv

      - name: Progressive squeeze (burnout vs emergence)
        if: github.event.inputs.script == 'test_progressive_squeeze.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_progressive_squeeze.py

      - name: Compare Picks_Log vs Model_Bet_Tracker
        if: github.event.inputs.script == 'compare_tabs.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python compare_tabs.py

      - name: Parlay bands (2 & 3 leg, score & edge, consensus odds)
        if: github.event.inputs.script == 'test_parlay_bands.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_parlay_bands.py

      - name: Edge bands (resolved hit% vs implied breakeven)
        if: github.event.inputs.script == 'test_edge_bands.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_edge_bands. py

      - name: Selector bake-off (find the blend1 feel)
        if: github.event.inputs.script == 'test_selector_bakeoff.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_selector_bakeoff.py

      - name: Platoon fix backtest (old vs new)
        if: github.event.inputs.script == 'test_platoon_backtest.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_platoon_backtest.py

      - name: Check pitcher source data
        if: github.event.inputs.script == 'check_pitcher_source.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python check_pitcher_source.py

      - name: Platoon progressive vs threshold backtest
        if: github.event.inputs.script == 'test_platoon_progressive.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_platoon_progressive.py

      - name: Platoon on full population (bias check)
        if: github.event.inputs.script == 'test_platoon_unfiltered.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_platoon_unfiltered.py

      - name: Diagnose platoon inversion
        if: github.event.inputs.script == 'test_platoon_diagnose.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_platoon_diagnose.py

      - name: Inspect matchup (DEV)
        if: github.event.inputs.script == 'inspect_matchup.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID_DEV }}
        run: python inspect_matchup.py "Murakami" "Fried"

      - name: Wind categories on HR 10+
        if: github.event.inputs.script == 'test_wind_categories.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_wind_categories.py

      - name: Wind effect controlled (hitter + park)
        if: github.event.inputs.script == 'test_wind_controlled.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_wind_controlled.py

      - name: Pitcher barrel penalty sizing
        if: github.event.inputs.script == 'test_pitcher_barrel.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_pitcher_barrel.py

      - name: Within-matchup separators (hidden metrics)
        if: github.event.inputs.script == 'test_within_matchup_separators.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_within_matchup_separators.py

      - name: Pitcher recent-form trends
        if: github.event.inputs.script == 'test_pitcher_trends.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_pitcher_trends.py

      - name: RR filter bakeoff (combined vs score×odds)
        if: github.event.inputs.script == 'test_filter_bakeoff.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_filter_bakeoff.py

      - name: Dueness test (gambler's fallacy check)
        if: github.event.inputs.script == 'test_dueness.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_dueness.py

      - name: Blend zones verify + parlay construction
        if: github.event.inputs.script == 'test_blend_zones.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_blend_zones.py

      - name: Monotonic diagnosis
        if: github.event.inputs.script == 'test_monotonic.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_monotonic.py

      - name: Pocket + inversion analysis
        if: github.event.inputs.script == 'test_pocket_and_inversion.py'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python test_pocket_and_inversion.py

